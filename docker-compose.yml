version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Database connection string pointing to the postgres container inside the network
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/booking_db?schema=public
      - NEXTAUTH_URL=https://yourdomain.com
      - AUTH_SECRET=your_nextauth_secret_here
      - N8N_WEBHOOK_URL=http://your-n8n-url/webhook/booking-handler
      - NEXT_PUBLIC_APP_NAME=NexCal
      - NEXT_PUBLIC_APP_URL=https://yourdomain.com
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    container_name: booking-db-prod
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=booking_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
